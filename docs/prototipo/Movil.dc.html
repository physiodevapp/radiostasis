<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Simulador de hipertensión — móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans+Condensed:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1C1916}
a{color:#F2B544}a:hover{color:#F7CF7A}
@keyframes flujo{from{transform:translateX(0)}to{transform:translateX(640px)}}
@keyframes latidoArriba-alto{0%{transform:translateY(0)}14%{transform:translateY(-6px)}45%{transform:translateY(0)}100%{transform:translateY(0)}}
@keyframes latidoAbajo-alto{0%{transform:translateY(0)}14%{transform:translateY(6px)}45%{transform:translateY(0)}100%{transform:translateY(0)}}
@keyframes latidoArriba-medio{0%{transform:translateY(0)}14%{transform:translateY(-3px)}45%{transform:translateY(0)}100%{transform:translateY(0)}}
@keyframes latidoAbajo-medio{0%{transform:translateY(0)}14%{transform:translateY(3px)}45%{transform:translateY(0)}100%{transform:translateY(0)}}
@keyframes latidoArriba-bajo{0%{transform:translateY(0)}14%{transform:translateY(-1px)}45%{transform:translateY(0)}100%{transform:translateY(0)}}
@keyframes latidoAbajo-bajo{0%{transform:translateY(0)}14%{transform:translateY(1px)}45%{transform:translateY(0)}100%{transform:translateY(0)}}
@keyframes onda{from{transform:translateX(-160px)}to{transform:translateX(800px)}}
@keyframes flujoM{from{transform:translateX(0)}to{transform:translateX(260px)}}
.flujo-m{animation-name:flujoM;animation-timing-function:linear;animation-iteration-count:infinite}
.flujo{animation-name:flujo;animation-timing-function:linear;animation-iteration-count:infinite}
.latido-arriba-alto{animation-name:latidoArriba-alto;animation-timing-function:ease-out;animation-iteration-count:infinite}
.latido-abajo-alto{animation-name:latidoAbajo-alto;animation-timing-function:ease-out;animation-iteration-count:infinite}
.latido-arriba-medio{animation-name:latidoArriba-medio;animation-timing-function:ease-out;animation-iteration-count:infinite}
.latido-abajo-medio{animation-name:latidoAbajo-medio;animation-timing-function:ease-out;animation-iteration-count:infinite}
.latido-arriba-bajo{animation-name:latidoArriba-bajo;animation-timing-function:ease-out;animation-iteration-count:infinite}
.latido-abajo-bajo{animation-name:latidoAbajo-bajo;animation-timing-function:ease-out;animation-iteration-count:infinite}
.onda{animation-name:onda;animation-timing-function:ease-in;animation-iteration-count:infinite}
@keyframes paso{0%{opacity:0;transform:scale(0.4)}35%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.35)}}
.paso{transform-box:fill-box;transform-origin:center;animation-name:paso;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
@media (prefers-reduced-motion: reduce){.paso,.flujo-m,.flujo,.onda,.latido-arriba-alto,.latido-abajo-alto,.latido-arriba-medio,.latido-abajo-medio,.latido-arriba-bajo,.latido-abajo-bajo{animation:none}}
</style>
</helmet>
<div style="width: 390px; min-height: 900px; box-sizing: border-box; padding: 16px; background: #1C1916; color: #EDE6D6; font-family: 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif; display: flex; flex-direction: column; gap: 12px">

  <svg width="0" height="0" aria-hidden="true" style="position: absolute">
    <defs>
      <radialGradient id="laton" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#F6E3A6"></stop><stop offset="0.55" stop-color="#C9A24A"></stop><stop offset="1" stop-color="#7E5E22"></stop></radialGradient>
      <radialGradient id="ventana" cx="50%" cy="50%" r="65%"><stop offset="0" stop-color="#FFE7B0"></stop><stop offset="1" stop-color="#E0A63E"></stop></radialGradient>
    </defs>
  </svg>

  <header style="display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <h1 style="margin: 0; font-size: 22px; font-weight: 600">Tensión arterial</h1>
      <button type="button" style="min-height: 44px; padding: 0 14px; background: {{accent}}; color: #1C1916; border: 0; border-radius: 10px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Modo reto</button>
    </div>
    <button type="button" aria-haspopup="listbox" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; padding: 0 14px; background: #26221E; color: #EDE6D6; border: 1px solid #4A423A; border-radius: 10px; font: inherit; font-size: 14px; cursor: pointer">
      <span><span style="color: #A89F91">Caso</span> <span style="font-weight: 600">8 · Hiperaldosteronismo primario</span></span>
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 5l4 4 4-4" fill="none" stroke="#EDE6D6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </button>
  </header>

  <div role="group" aria-label="Escala de tiempo" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #26221E; border: 1px solid #4A423A; border-radius: 12px">
    <button type="button" aria-pressed="false" style="min-height: 40px; border: 0; border-radius: 8px; background: transparent; color: #CFC6B6; font: inherit; font-size: 14px; cursor: pointer">Minutos</button>
    <button type="button" aria-pressed="false" style="min-height: 40px; border: 0; border-radius: 8px; background: transparent; color: #CFC6B6; font: inherit; font-size: 14px; cursor: pointer">Días</button>
    <button type="button" aria-pressed="true" style="min-height: 40px; border: 0; border-radius: 8px; background: #EDE6D6; color: #1C1916; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Estable</button>
  </div>

  <div style="display: flex; align-items: stretch; gap: 8px">
    <figure style="flex: 1 1 auto; min-width: 0; margin: 0; display: flex; flex-direction: column; gap: 4px">
      <svg viewBox="0 0 260 104" role="img" aria-label="Arteria grande en corte longitudinal con flujo y pulso" style="width: 100%; height: auto; border-radius: 8px; display: block">
        <defs><clipPath id="recorteLuzM"><rect x="0" y="30" width="260" height="44"></rect></clipPath></defs>
        <rect width="260" height="104" fill="#211A17"></rect>
        <rect x="0" y="30" width="260" height="44" fill="#5E1517"></rect>
        <g clip-path="url(#recorteLuzM)">
          <g class="flujo-m" style="animation-duration: {{flowDur}}s; animation-play-state: {{playState}}" fill="#D04A42">
          <ellipse cx="-259" cy="63" rx="6" ry="3.5"></ellipse> <ellipse cx="-236" cy="65" rx="6" ry="3.5"></ellipse> <ellipse cx="-212" cy="42" rx="6" ry="3.5"></ellipse> <ellipse cx="-195" cy="58" rx="6" ry="3.5"></ellipse>
          <ellipse cx="-169" cy="47" rx="6" ry="3.5"></ellipse> <ellipse cx="-148" cy="65" rx="6" ry="3.5"></ellipse> <ellipse cx="-127" cy="45" rx="6" ry="3.5"></ellipse> <ellipse cx="-104" cy="65" rx="6" ry="3.5"></ellipse>
          <ellipse cx="-81" cy="39" rx="6" ry="3.5"></ellipse> <ellipse cx="-59" cy="62" rx="6" ry="3.5"></ellipse> <ellipse cx="-41" cy="40" rx="6" ry="3.5"></ellipse> <ellipse cx="-18" cy="59" rx="6" ry="3.5"></ellipse>
          <ellipse cx="1" cy="63" rx="6" ry="3.5"></ellipse> <ellipse cx="24" cy="65" rx="6" ry="3.5"></ellipse> <ellipse cx="48" cy="42" rx="6" ry="3.5"></ellipse> <ellipse cx="65" cy="58" rx="6" ry="3.5"></ellipse>
          <ellipse cx="91" cy="47" rx="6" ry="3.5"></ellipse> <ellipse cx="112" cy="65" rx="6" ry="3.5"></ellipse> <ellipse cx="133" cy="45" rx="6" ry="3.5"></ellipse> <ellipse cx="156" cy="65" rx="6" ry="3.5"></ellipse>
          <ellipse cx="179" cy="39" rx="6" ry="3.5"></ellipse> <ellipse cx="201" cy="62" rx="6" ry="3.5"></ellipse> <ellipse cx="219" cy="40" rx="6" ry="3.5"></ellipse> <ellipse cx="242" cy="59" rx="6" ry="3.5"></ellipse>
          </g>
        </g>
        <g class="latido-arriba-{{ampLevel}}" style="animation-duration: {{beatDur}}s; animation-play-state: {{playState}}">
          <rect x="0" y="6" width="260" height="26" fill="#8E443C"></rect>
          <rect x="0" y="28" width="260" height="4" fill="#E2A196"></rect>
        </g>
        <g class="latido-abajo-{{ampLevel}}" style="animation-duration: {{beatDur}}s; animation-play-state: {{playState}}">
          <rect x="0" y="72" width="260" height="26" fill="#8E443C"></rect>
          <rect x="0" y="72" width="260" height="4" fill="#E2A196"></rect>
        </g>
      </svg>
      <figcaption style="font-size: 12px; color: #CFC6B6">Arteria grande</figcaption>
    </figure>
    <figure style="flex: none; width: 90px; margin: 0; display: flex; flex-direction: column; gap: 4px">
      <svg viewBox="0 0 240 240" role="img" aria-label="Arteriola en corte transversal con la luz algo estrechada" style="width: 90px; height: 90px; display: block">
        <defs><clipPath id="recorteArteriolaM"><circle cx="120" cy="120" r="{{lumenR}}"></circle></clipPath></defs><rect width="240" height="240" rx="16" fill="#211A17"></rect>
        <circle cx="120" cy="120" r="100" fill="#6E3530"></circle>
        <circle cx="120" cy="120" r="88" fill="#8E443C"></circle>
        <circle cx="120" cy="120" r="{{intimaR}}" fill="#E2A196"></circle>
        <circle cx="120" cy="120" r="{{lumenR}}" fill="#5E1517"></circle>
        <g clip-path="url(#recorteArteriolaM)"><circle class="paso" cx="120" cy="120" r="8" fill="#D04A42" style="animation-duration: {{pasoDur}}s; animation-delay: -{{pasoDelay0}}s; animation-play-state: {{playState}}"></circle><circle class="paso" cx="102" cy="110" r="8" fill="#D04A42" style="animation-duration: {{pasoDur}}s; animation-delay: -{{pasoDelay1}}s; animation-play-state: {{playState}}"></circle><circle class="paso" cx="136" cy="106" r="8" fill="#D04A42" style="animation-duration: {{pasoDur}}s; animation-delay: -{{pasoDelay2}}s; animation-play-state: {{playState}}"></circle><circle class="paso" cx="108" cy="136" r="8" fill="#D04A42" style="animation-duration: {{pasoDur}}s; animation-delay: -{{pasoDelay3}}s; animation-play-state: {{playState}}"></circle><circle class="paso" cx="140" cy="130" r="8" fill="#D04A42" style="animation-duration: {{pasoDur}}s; animation-delay: -{{pasoDelay4}}s; animation-play-state: {{playState}}"></circle><circle class="paso" cx="96" cy="124" r="8" fill="#D04A42" style="animation-duration: {{pasoDur}}s; animation-delay: -{{pasoDelay5}}s; animation-play-state: {{playState}}"></circle><circle class="paso" cx="126" cy="96" r="8" fill="#D04A42" style="animation-duration: {{pasoDur}}s; animation-delay: -{{pasoDelay6}}s; animation-play-state: {{playState}}"></circle><circle class="paso" cx="124" cy="142" r="8" fill="#D04A42" style="animation-duration: {{pasoDur}}s; animation-delay: -{{pasoDelay7}}s; animation-play-state: {{playState}}"></circle></g>
      </svg>
      <figcaption style="font-size: 12px; color: #CFC6B6">Arteriola</figcaption>
    </figure>
    <button type="button" aria-label="{{pauseLabel}} animación" aria-pressed="{{paused}}" onClick="{{togglePause}}" style="flex: none; align-self: flex-start; width: 44px; height: 44px; padding: 0; display: flex; align-items: center; justify-content: center; background: #26221E; border: 1px solid #4A423A; border-radius: 10px; cursor: pointer">
      <sc-if value="{{paused}}" hint-placeholder-val="{{ false }}">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M4 2.5v9l7-4.5z" fill="#EDE6D6"></path></svg>
      </sc-if>
      <sc-if value="{{running}}" hint-placeholder-val="{{ true }}">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M4 2.5v9M10 2.5v9" stroke="#EDE6D6" stroke-width="2.2" stroke-linecap="round"></path></svg>
      </sc-if>
    </button>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: #26221E; border: 1px solid #3A342E; border-radius: 14px">
    <svg width="96" height="96" viewBox="0 0 260 260" role="img" aria-label="Presión sistólica y diastólica algo altas" style="flex: none; display: block">
      <circle cx="130" cy="130" r="126" fill="url(#laton)"></circle>
      <circle cx="130" cy="130" r="114" fill="url(#ventana)"></circle>
      <line x1="130" y1="22" x2="130" y2="38" stroke="#3A2410" stroke-width="4" transform="rotate(-135.0 130 130)"></line><line x1="130" y1="22" x2="130" y2="32" stroke="#3A2410" stroke-width="2.5" transform="rotate(-112.5 130 130)"></line><line x1="130" y1="22" x2="130" y2="32" stroke="#3A2410" stroke-width="2.5" transform="rotate(-90.0 130 130)"></line><line x1="130" y1="22" x2="130" y2="38" stroke="#3A2410" stroke-width="4" transform="rotate(-67.5 130 130)"></line><line x1="130" y1="22" x2="130" y2="32" stroke="#3A2410" stroke-width="2.5" transform="rotate(-45.0 130 130)"></line><line x1="130" y1="22" x2="130" y2="32" stroke="#3A2410" stroke-width="2.5" transform="rotate(-22.5 130 130)"></line><line x1="130" y1="22" x2="130" y2="38" stroke="#3A2410" stroke-width="4" transform="rotate(0.0 130 130)"></line><line x1="130" y1="22" x2="130" y2="32" stroke="#3A2410" stroke-width="2.5" transform="rotate(22.5 130 130)"></line><line x1="130" y1="22" x2="130" y2="32" stroke="#3A2410" stroke-width="2.5" transform="rotate(45.0 130 130)"></line><line x1="130" y1="22" x2="130" y2="38" stroke="#3A2410" stroke-width="4" transform="rotate(67.5 130 130)"></line><line x1="130" y1="22" x2="130" y2="32" stroke="#3A2410" stroke-width="2.5" transform="rotate(90.0 130 130)"></line><line x1="130" y1="22" x2="130" y2="32" stroke="#3A2410" stroke-width="2.5" transform="rotate(112.5 130 130)"></line><line x1="130" y1="22" x2="130" y2="38" stroke="#3A2410" stroke-width="4" transform="rotate(135.0 130 130)"></line>
      <line x1="130" y1="130" x2="130" y2="56" stroke="#8A5A2E" stroke-width="10" stroke-linecap="round" transform="rotate({{padAngle}} 130 130)"></line>
      <line x1="130" y1="130" x2="130" y2="44" stroke="#B3362F" stroke-width="10" stroke-linecap="round" transform="rotate({{pasAngle}} 130 130)"></line>
      <circle cx="130" cy="130" r="18" fill="url(#laton)" stroke="#5C4418" stroke-width="3"></circle>
    </svg>
    <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; gap: 12px; font-size: 13px">
        <span style="display: flex; align-items: center; gap: 5px"><span style="width: 12px; height: 4px; border-radius: 2px; background: #D04A42"></span>PAS {{pasArrow}}</span>
        <span style="display: flex; align-items: center; gap: 5px"><span style="width: 12px; height: 4px; border-radius: 2px; background: #C58B4E"></span>PAD {{padArrow}}</span>
      </div>
      <sc-for list="{{salidas}}" as="s" hint-placeholder-count="3">
        <svg viewBox="0 0 220 30" role="img" aria-label="{{s.name}}: {{s.arrow}}" style="width: 100%; height: auto; display: block"><rect width="220" height="30" rx="5" fill="#2B211B"></rect><rect x="2" y="2" width="216" height="26" rx="4" fill="url(#ventana)"></rect><line x1="10" y1="5" x2="10" y2="9" stroke="#3A2410" stroke-width="1"></line><line x1="30" y1="5" x2="30" y2="9" stroke="#3A2410" stroke-width="1"></line><line x1="50" y1="5" x2="50" y2="9" stroke="#3A2410" stroke-width="1"></line><line x1="70" y1="5" x2="70" y2="9" stroke="#3A2410" stroke-width="1"></line><line x1="90" y1="5" x2="90" y2="9" stroke="#3A2410" stroke-width="1"></line><line x1="110" y1="5" x2="110" y2="12" stroke="#3A2410" stroke-width="1.8"></line><line x1="130" y1="5" x2="130" y2="9" stroke="#3A2410" stroke-width="1"></line><line x1="150" y1="5" x2="150" y2="9" stroke="#3A2410" stroke-width="1"></line><line x1="170" y1="5" x2="170" y2="9" stroke="#3A2410" stroke-width="1"></line><line x1="190" y1="5" x2="190" y2="9" stroke="#3A2410" stroke-width="1"></line><line x1="210" y1="5" x2="210" y2="9" stroke="#3A2410" stroke-width="1"></line><text x="8" y="24" fill="#2B1E0A" font-size="11" font-weight="600" font-family="IBM Plex Sans Condensed, sans-serif">{{s.name}}</text><text x="212" y="24" text-anchor="end" fill="#2B1E0A" font-size="11" font-family="IBM Plex Mono, monospace">{{s.arrow}}</text><rect x="{{s.x}}" y="3" width="2" height="24" fill="#1C1916"></rect></svg>
      </sc-for>
    </div>
  </div>

  <div role="tablist" aria-label="Paneles" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid #3A342E">
    <button type="button" role="tab" aria-selected="true" style="min-height: 44px; border: 0; border-bottom: 3px solid {{accent}}; background: transparent; color: #EDE6D6; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Causas</button>
    <button type="button" role="tab" aria-selected="false" style="min-height: 44px; border: 0; border-bottom: 3px solid transparent; background: transparent; color: #CFC6B6; font: inherit; font-size: 15px; cursor: pointer">Mecanismos</button>
    <button type="button" role="tab" aria-selected="false" style="min-height: 44px; border: 0; border-bottom: 3px solid transparent; background: transparent; color: #CFC6B6; font: inherit; font-size: 15px; cursor: pointer">Analítica</button>
  </div>

  <div role="tabpanel" style="box-sizing: border-box; padding: 14px 8px; border-radius: 14px; background: repeating-linear-gradient(92deg, #5A3420 0px, #6B3F26 7px, #4E2C1A 13px, #633923 21px); border: 4px solid #3A2114; box-shadow: inset 0 0 18px rgba(0,0,0,0.45); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 4px; justify-items: center">
    <sc-for list="{{causas}}" as="c" hint-placeholder-count="12">
      <button type="button" aria-label="{{c.aria}}" style="display: flex; flex-direction: column; align-items: center; gap: 2px; width: 100%; padding: 0; background: transparent; border: 0; font: inherit; cursor: grab">
        <svg width="72" height="72" viewBox="0 0 120 120" aria-hidden="true" style="display: block"><line x1="60" y1="4" x2="60" y2="10" stroke="#EDE6D6" stroke-opacity="0.85" stroke-width="2.5" transform="rotate(-135.0 60 60)"></line><line x1="60" y1="4" x2="60" y2="10" stroke="#EDE6D6" stroke-opacity="0.85" stroke-width="1.5" transform="rotate(-108.0 60 60)"></line><line x1="60" y1="4" x2="60" y2="10" stroke="#EDE6D6" stroke-opacity="0.85" stroke-width="1.5" transform="rotate(-81.0 60 60)"></line><line x1="60" y1="4" x2="60" y2="10" stroke="#EDE6D6" stroke-opacity="0.85" stroke-width="1.5" transform="rotate(-54.0 60 60)"></line><line x1="60" y1="4" x2="60" y2="10" stroke="#EDE6D6" stroke-opacity="0.85" stroke-width="1.5" transform="rotate(-27.0 60 60)"></line><line x1="60" y1="4" x2="60" y2="10" stroke="#EDE6D6" stroke-opacity="0.85" stroke-width="2.5" transform="rotate(0.0 60 60)"></line><line x1="60" y1="4" x2="60" y2="10" stroke="#EDE6D6" stroke-opacity="0.85" stroke-width="1.5" transform="rotate(27.0 60 60)"></line><line x1="60" y1="4" x2="60" y2="10" stroke="#EDE6D6" stroke-opacity="0.85" stroke-width="1.5" transform="rotate(54.0 60 60)"></line><line x1="60" y1="4" x2="60" y2="10" stroke="#EDE6D6" stroke-opacity="0.85" stroke-width="1.5" transform="rotate(81.0 60 60)"></line><line x1="60" y1="4" x2="60" y2="10" stroke="#EDE6D6" stroke-opacity="0.85" stroke-width="1.5" transform="rotate(108.0 60 60)"></line><line x1="60" y1="4" x2="60" y2="10" stroke="#EDE6D6" stroke-opacity="0.85" stroke-width="2.5" transform="rotate(135.0 60 60)"></line><circle cx="60" cy="60" r="46" fill="none" stroke="#2A1810" stroke-width="5" stroke-dasharray="216.8 1000" transform="rotate(135 60 60)"></circle><circle cx="60" cy="60" r="46" fill="none" stroke="{{c.arcColor}}" stroke-width="5" stroke-dasharray="{{c.arcDash}}" transform="rotate(135 60 60)"></circle><circle cx="60" cy="60" r="39.5" fill="#1F120A"></circle><circle cx="60" cy="60" r="38" fill="#7A5A22"></circle><circle cx="60" cy="60" r="36.5" fill="none" stroke="#E6C878" stroke-width="4" stroke-dasharray="2.2 1.8"></circle><circle cx="60" cy="60" r="33" fill="url(#laton)"></circle><circle cx="60" cy="60" r="16" fill="none" stroke="#5C4418" stroke-opacity="0.25" stroke-width="1"></circle><circle cx="60" cy="60" r="29" fill="none" stroke="#5C4418" stroke-opacity="0.25" stroke-width="1"></circle><line x1="60" y1="30" x2="60" y2="44" stroke="#2B1E0A" stroke-width="3" stroke-linecap="round" transform="rotate({{c.angle}} 60 60)"></line><text x="10" y="116" fill="#EDE6D6" font-size="11" font-family="IBM Plex Mono, monospace">{{c.lo}}</text><text x="110" y="116" text-anchor="end" fill="#EDE6D6" font-size="11" font-family="IBM Plex Mono, monospace">{{c.hi}}</text></svg>
        <span style="display: block; width: 100%; max-width: 84px; box-sizing: border-box; padding: 3px 4px; border-radius: 3px; background: linear-gradient(180deg, #F3E7C6, #DCC99A); box-shadow: inset 0 0 0 1px #A88A48; color: #2B1E0A; font-size: 11px; line-height: 1.1; font-weight: {{c.weight}}; text-align: center">{{c.name}}</span>
      </button>
    </sc-for>
  </div>

  <button type="button" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 48px; margin-top: auto; padding: 0 14px; background: #26221E; color: #EDE6D6; border: 1px solid {{accent}}; border-radius: 12px; font: inherit; font-size: 14px; cursor: pointer">
    <span><span style="color: {{accent}}; font-weight: 600">Qué mirar:</span> renina ↓↓, aldosterona ↑↑, potasio ↓↓</span>
    <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M5 3l4 4-4 4" fill="none" stroke="#EDE6D6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"acento":{"editor":"color","default":"#F2B544","options":["#F2B544","#E8875B","#8FC7A6"]},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { paused: false };
  }
  renderVals() {
    const accent = this.props.acento ?? '#F2B544';
    const paused = !!this.state.paused;
    const BLUE = '#6FA8DC';
    const TRACK = '#3A342E';
    const MUTED = '#A89F91';
    const arrow = (v) => v >= 0.5 ? '↑↑' : v >= 0.15 ? '↑' : v <= -0.5 ? '↓↓' : v <= -0.15 ? '↓' : '=';
    const tone = (v) => v >= 0.15 ? accent : v <= -0.15 ? BLUE : MUTED;

    const knob = (c) => {
      const t = (c.v - c.min) / (c.max - c.min);
      const angle = (-135 + t * 270).toFixed(1);
      const H = 108.4, F = 216.8;
      let arcDash = '0 1000', arcColor = accent;
      if (c.min < 0 && c.max > 0) {
        if (c.v > 0) arcDash = `0 ${H} ${(H * c.v).toFixed(1)} 1000`;
        else if (c.v < 0) { arcDash = `0 ${(H * (1 + c.v)).toFixed(1)} ${(H * -c.v).toFixed(1)} 1000`; arcColor = BLUE; }
      } else if (c.max <= 0) {
        if (c.v < 0) { arcDash = `0 ${(F * t).toFixed(1)} ${(F * (1 - t)).toFixed(1)} 1000`; arcColor = BLUE; }
      } else if (c.v > 0) {
        arcDash = `${(F * t).toFixed(1)} 1000`;
      }
      const lo = c.min < 0 && c.max > 0 ? '−' : c.max <= 0 ? 'nulo' : '0';
      const hi = c.min < 0 && c.max > 0 ? '+' : c.max <= 0 ? 'libre' : '1';
      const on = c.v !== 0;
      const valText = c.zeroText && !on ? c.zeroText : (on ? (c.v > 0 ? '+' + c.v : String(c.v)) : 'normal');
      return { ...c, angle, arcDash, arcColor, lo, hi, valText, weight: on ? 600 : 500, aria: `${c.name}: ${valText}` };
    };

    const causas = [
      { name: 'Edad', v: 0, min: 0, max: 1, zeroText: 'joven' },
      { name: 'Factores de riesgo', v: 0, min: 0, max: 1, zeroText: 'ninguno' },
      { name: 'Sal', v: 0, min: -1, max: 1 },
      { name: 'Tiroides', v: 0, min: -1, max: 1 },
      { name: 'ADH autónoma', v: 0, min: -1, max: 1 },
      { name: 'Estenosis renal', v: 0, min: 0, max: 1, zeroText: 'no' },
      { name: 'Caída filtración', v: 0, min: 0, max: 1, zeroText: 'no' },
      { name: 'Tumor renina', v: 0, min: 0, max: 1, zeroText: 'no' },
      { name: 'Hiperaldo.', v: 1, min: 0, max: 1 },
      { name: 'Feocromo.', v: 0, min: 0, max: 1, zeroText: 'no' },
      { name: 'Regaliz', v: 0, min: 0, max: 1, zeroText: 'no' },
      { name: 'Acceso agua', v: 0, min: -1, max: 0, zeroText: 'libre' }
    ].map(knob);

    const bar = (name, v) => ({
      name, arrow: arrow(v), color: tone(v), x: (10 + (v + 1) / 2 * 200 - 1).toFixed(1),
      left: v >= 0 ? 50 : 50 + v * 50,
      width: Math.max(Math.abs(v) * 50, 1)
    });
    const salidas = [bar('Volemia', 0.25), bar('GC', 0.05), bar('RVP', 0.3)];

    const pas = 0.35, pad = 0.3;
    const gc = 0.05, fc = 0, rigidez = 0, rvp = 0.3;
    const lumenR = Math.round(44 * (1 - 0.35 * rvp));
    const pasoDur = Number((1.8 / (1 + 0.8 * gc)).toFixed(2));
    return {
      accent, causas, salidas,
      paused, running: !paused,
      pauseLabel: paused ? 'Reanudar' : 'Pausar',
      playState: paused ? 'paused' : 'running',
      togglePause: () => this.setState({ paused: !this.state.paused }),
      flowDur: (3 / (1 + 0.8 * gc)).toFixed(2),
      beatDur: (1 / (1 + 0.6 * fc)).toFixed(2),
      ampLevel: rigidez >= 0.5 ? 'bajo' : rigidez >= 0.15 ? 'medio' : 'alto',
      pasoDur,
      pasoDelay0: (pasoDur * 0 / 8).toFixed(2),
      pasoDelay1: (pasoDur * 1 / 8).toFixed(2),
      pasoDelay2: (pasoDur * 2 / 8).toFixed(2),
      pasoDelay3: (pasoDur * 3 / 8).toFixed(2),
      pasoDelay4: (pasoDur * 4 / 8).toFixed(2),
      pasoDelay5: (pasoDur * 5 / 8).toFixed(2),
      pasoDelay6: (pasoDur * 6 / 8).toFixed(2),
      pasoDelay7: (pasoDur * 7 / 8).toFixed(2),
      lumenR, intimaR: lumenR + 5,
      pasAngle: pas * 135, padAngle: pad * 135,
      pasArrow: arrow(pas), padArrow: arrow(pad)
    };
  }
}
</script>
</body>
